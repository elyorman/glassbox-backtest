[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-backtest"
version = "0.7.0"
description = "Transparent, auditable Python backtests of four published ETF strategies, with exact Decimal accounting and evidence packs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elyorjon Mannonov" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["backtesting", "quantitative-finance", "etf", "trend-following", "dual-momentum", "sector-rotation",
            "risk-parity", "deflated-sharpe-ratio", "portfolio-backtesting", "tiingo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/elyorman/glassbox-backtest"

[project.optional-dependencies]
parquet = ["pyarrow>=18,<24"]

[project.scripts]
quant-data = "quant_core.cli:main"
quant-backtest = "quant_core.backtest.cli:main"
quant-strategies = "quant_core.strategies.cli:main"
quant-study = "quant_core.validation.study_cli:main"
quant-universe = "quant_core.universes.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
